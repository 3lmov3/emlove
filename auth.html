<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Emlove — potwierdzenie konta</title>
<style>
  :root{--ink:#1c2b28;--muted:#6b7c78;--teal:#0f766e;--line:#e2e8e6;--bg:#f6f8f7}
  *{box-sizing:border-box}
  body{margin:0;padding:24px;background:var(--bg);color:var(--ink);
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       min-height:100vh;display:flex;align-items:center;justify-content:center}
  main{max-width:460px;width:100%;background:#fff;border:1px solid var(--line);
       border-radius:16px;padding:28px}
  h1{font-size:20px;margin:0 0 6px;color:var(--teal)}
  p{font-size:15px;line-height:1.6;margin:0 0 16px}
  .muted{color:var(--muted);font-size:13px}
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
  input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;
        font-size:16px;margin-bottom:12px;color:var(--ink)}
  button{width:100%;padding:13px;border:0;border-radius:10px;background:var(--teal);
         color:#fff;font-size:15px;font-weight:700;cursor:pointer}
  button:disabled{opacity:.5}
  .ok{color:#0f766e}
  .err{color:#b91c1c}
  a{color:var(--teal);font-weight:700}
  @media (prefers-color-scheme:dark){
    :root{--ink:#e6eeec;--muted:#9aaba6;--line:#2b3a36;--bg:#101917}
    main{background:#16211e}
    input{background:#101917;color:var(--ink)}
  }
</style>
</head>
<body>
<main>
  <h1>Emlove</h1>
  <p id="status" class="muted">Sprawdzam link…</p>

  <form id="reset" hidden autocomplete="off">
    <label for="pw">Nowe hasło (min. 8 znaków)</label>
    <input id="pw" type="password" minlength="8" autocomplete="new-password" required>
    <button id="save" type="submit">Zapisz nowe hasło</button>
  </form>

  <p class="muted">Po zakończeniu wróć do aplikacji Emlove na telefonie i zaloguj się.</p>
</main>

<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.49.8';

// Wartości z config.js tej PWA (ten sam projekt Supabase co aplikacja mobilna).
const SUPABASE_URL = 'https://dwvcdpipjgpgcjycjcpt.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_I40qrtffaEh-pl0hbGS0NQ_QRWzsMLN';

const statusEl = document.getElementById('status');
const formEl = document.getElementById('reset');
const pwEl = document.getElementById('pw');
const saveEl = document.getElementById('save');

function say(text, kind) {
  statusEl.textContent = text;
  statusEl.className = kind || 'muted';
}

// Supabase przekierowuje tutaj także w razie BŁĘDU, z parametrami w URL.
// Bez tego użytkownik widziałby pustą stronę albo 404.
const ERRORS = {
  otp_expired: 'Link wygasł lub został już użyty. Wróć do aplikacji i poproś o nowy link.',
  access_denied: 'Link nie jest już ważny. Wróć do aplikacji i poproś o nowy.',
  otp_disabled: 'Ten link został już wykorzystany. Wróć do aplikacji i zaloguj się.',
  validation_failed: 'Link jest uszkodzony. Otwórz go ponownie z maila albo poproś o nowy.',
  session_not_found: 'Nie znaleziono sesji. Otwórz link ponownie z maila.',
  user_banned: 'To konto zostało zablokowane.',
  provider_email_needs_verification: 'Ten adres wymaga potwierdzenia. Sprawdź skrzynkę.',
};

function showError(code, description) {
  say(ERRORS[code] || ('Link nie zadziałał. ' + (description || 'Wróć do aplikacji i poproś o nowy.')), 'err');
}

const query = new URLSearchParams(location.search);
const hash = new URLSearchParams(location.hash.slice(1));

const qError = query.get('error');
const qCode = query.get('error_code') || query.get('code');
const qDesc = query.get('error_description');

const hError = hash.get('error');
const hCode = hash.get('error_code');
const hDesc = hash.get('error_description');

if (!SUPABASE_URL || !SUPABASE_ANON_KEY) {
  say('Strona nie jest skonfigurowana. Uzupełnij SUPABASE_URL i SUPABASE_ANON_KEY w auth.html.', 'err');
} else if (qError || hError) {
  // Błąd od Supabase — nie ma sesji do odczytania.
  showError(qCode || hCode || qError || hError, qDesc || hDesc);
} else if (!query.get('code') && !hash.get('access_token')) {
  say('Ten adres służy do potwierdzania konta. Otwórz go z linku w mailu, który od nas dostałeś.', 'muted');
} else {
  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: {detectSessionInUrl: true, persistSession: true},
  });

  const type = hash.get('type') || '';

  try {
    // Obsługa obu przepływów: PKCE (code w query) i implicit (token w hash).
    if (query.get('code')) {
      const {error} = await supabase.auth.exchangeCodeForSession(query.get('code'));
      if (error) throw error;
    }

    const {data, error} = await supabase.auth.getSession();
    if (error) throw error;

    if (!data.session) {
      say('Link wygasł lub został już użyty. Wróć do aplikacji i poproś o nowy.', 'err');
    } else if (type === 'recovery' || data.session.user?.recovery_sent_at) {
      say('Ustaw nowe hasło do swojego konta.');
      formEl.hidden = false;
      pwEl.focus();
    } else {
      say('Adres e-mail został potwierdzony. Możesz wrócić do aplikacji i zalogować się.', 'ok');
    }
  } catch (e) {
    say('Nie udało się potwierdzić linku. Otwórz go ponownie z maila albo poproś o nowy.', 'err');
    console.error(e);
  }

  formEl.addEventListener('submit', async event => {
    event.preventDefault();
    const password = pwEl.value;
    if (password.length < 8) {
      say('Hasło musi mieć co najmniej 8 znaków.', 'err');
      return;
    }
    saveEl.disabled = true;
    try {
      const {error} = await supabase.auth.updateUser({password});
      if (error) throw error;
      formEl.hidden = true;
      say('Hasło zmienione. Wróć do aplikacji i zaloguj się nowym hasłem.', 'ok');
    } catch (e) {
      say('Nie udało się zapisać hasła. Spróbuj ponownie.', 'err');
      console.error(e);
    } finally {
      saveEl.disabled = false;
    }
  });
}
</script>
</body>
</html>
